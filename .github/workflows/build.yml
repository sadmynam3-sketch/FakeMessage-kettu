name: Build FakeMessage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare plugin
        run: |
          mkdir -p dist/FakeMessage
          cp FakeMessage/index.js dist/FakeMessage/index.js
          cp FakeMessage/manifest.json dist/FakeMessage/manifest.json

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FakeMessage
          path: dist/FakeMessage/
